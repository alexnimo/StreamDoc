[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamdoc"
version = "0.1.0"
description = "YouTube channel to PDF presentation pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "StreamDoc" }]
keywords = ["youtube", "pdf", "automation", "notebooklm"]
classifiers = []

dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "apscheduler>=3.10",
  "yt-dlp>=2024.12.0",
  "bgutil-ytdlp-pot-provider>=1.3.1",
  "ffmpeg-python>=0.2",
  "click>=8.1",
  "faster-whisper>=1.0.0",
  "Pillow>=10.0",
  "imagehash>=4.3",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "aiofiles>=23.2",
  "aiohttp>=3.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "youtube-transcript-api>=0.6",
  "reportlab>=4.0",
  "PyYAML>=6.0",
  "playwright>=1.60.0",
  "notebooklm-py @ git+https://github.com/teng-lin/notebooklm-py.git",
  "pydantic-core>=2.46.4",
  "curl-cffi>=0.7",
  "twitter-cli",
  "rdt-cli",
  "filelock>=3.29.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-PyYAML>=6.0",
  "types-reportlab>=4.0",
]
notebooklm-cookies = [
  "notebooklm-py[cookies]",
]

[project.scripts]
streamdoc = "streamdoc.cli:main"
streamdoc-api = "streamdoc.api.app:run"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/streamdoc"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "pyproject.toml", "README.md", "ProjectPRD.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit real external APIs and may require auth",
]

[tool.mypy]
strict = true
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.sources]
# Reason: these repos are updated regularly; omit the branch so uv follows the
# repository's default branch and ``uv lock --upgrade`` always pulls the latest.
twitter-cli = { git = "https://github.com/public-clis/twitter-cli.git" }
rdt-cli = { git = "https://github.com/public-clis/rdt-cli.git" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
